name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Unzip the mod
        run: unzip -o mod.zip -d project

      - name: Build
        working-directory: project
        run: gradle build --no-daemon

      - name: Pick the mod jar (skip the sources jar)
        run: |
          mkdir dist
          JAR=$(ls project/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" dist/ArmorEstimator-1.21.11.jar

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Newest build of the mod. Download the .jar below.
          files: dist/ArmorEstimator-1.21.11.jar
